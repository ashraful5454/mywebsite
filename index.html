<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Md Ashaful Islam – WordPress Developer</title>
<style>
:root{color-scheme:dark;--bg:#07060f;--card:#12101f;--tx:#f2efff;--mu:#a29fc0;--a:#7c5cff;--b:#00e0c6;--c:#ff4fa3;--g:linear-gradient(120deg,var(--a),var(--c),var(--b));box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}html{scroll-behavior:smooth;scroll-padding-top:70px}
body{background:var(--bg);color:var(--tx);font-family:Poppins,"Segoe UI",system-ui,sans-serif;line-height:1.6;overflow-x:hidden}
.blob{position:fixed;border-radius:50%;filter:blur(90px);opacity:.35;z-index:-1;animation:fl 14s ease-in-out infinite alternate}
.b1{width:420px;height:420px;background:var(--a);top:-100px;left:-100px}.b2{width:380px;height:380px;background:var(--c);right:-120px;top:30%;animation-delay:-5s}.b3{width:340px;height:340px;background:var(--b);bottom:-100px;left:30%;animation-delay:-9s}
@keyframes fl{to{transform:translate(80px,60px) scale(1.2)}}
nav{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:14px 5vw;padding-top:calc(14px + env(safe-area-inset-top,0px));backdrop-filter:blur(14px);background:#07060fb3}
nav b{font-size:1.2rem;background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}
nav div{display:flex;gap:22px}nav a{color:var(--mu);text-decoration:none;font-size:.92rem;transition:.3s}nav a:hover{color:var(--b)}
section{padding:100px 5vw 40px;max-width:1150px;margin:auto}
.hero{min-height:100vh;display:grid;grid-template-columns:1.2fr 1fr;gap:40px;align-items:center}
.hi{color:var(--b);letter-spacing:2px;font-size:.9rem}
h1{font-size:clamp(2.2rem,6vw,4rem);line-height:1.1;margin:10px 0}
.grad{background:var(--g);background-size:200%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:gs 6s linear infinite}
@keyframes gs{to{background-position:200%}}
.typ{font-size:1.3rem;color:var(--mu);min-height:2rem}.typ:after{content:"|";animation:bl 1s infinite;color:var(--b)}@keyframes bl{50%{opacity:0}}
.bio{color:var(--mu);margin:16px 0 26px;max-width:520px}
.btn{display:inline-block;padding:13px 26px;border-radius:50px;text-decoration:none;color:#fff;font-weight:600;background:var(--g);background-size:200%;transition:.4s;margin:0 10px 10px 0;border:0;cursor:pointer;font-size:.95rem}
.btn:hover{transform:translateY(-4px);box-shadow:0 12px 30px #7c5cff66;background-position:100%}
.btn.o{background:none;border:1.5px solid var(--a)}
.ph{position:relative;width:min(380px,80vw);aspect-ratio:1;margin:auto;border-radius:50%;padding:6px;background:var(--g);animation:sp 8s linear infinite}
.ph:before{content:"";position:absolute;inset:-18px;border-radius:50%;border:2px dashed #7c5cff88;animation:sp 20s linear infinite reverse}
@keyframes sp{to{filter:hue-rotate(360deg)}}
.ph img{width:100%;height:100%;border-radius:50%;object-fit:cover;background:var(--card);display:block}
.ph.drop{outline:3px dashed var(--b);outline-offset:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px;margin-top:20px}
.card{background:var(--card);border:1px solid #ffffff14;border-radius:20px;padding:24px;transition:.4s;position:relative;overflow:hidden}
.card:hover{border-color:var(--a);box-shadow:0 10px 40px #7c5cff33}
.stat b{display:block;font-size:2.2rem}
h2{font-size:clamp(1.7rem,4vw,2.4rem);margin-bottom:28px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px}
.card h3{margin-bottom:8px}.card p{color:var(--mu);font-size:.93rem}
.card .n{font-size:2.4rem;font-weight:800;opacity:.25}
.card a{color:var(--b);text-decoration:none;display:inline-block;margin-top:12px}
.mq{overflow:hidden;margin:50px 0;border-block:1px solid #ffffff14;padding:16px 0}
.mq div{display:flex;gap:50px;width:max-content;animation:mq 25s linear infinite;color:var(--mu);font-size:1.2rem;font-weight:600}
@keyframes mq{to{transform:translateX(-50%)}}
.ct a.row{display:flex;gap:16px;align-items:center;color:var(--tx);text-decoration:none;word-break:break-all}.ct a.row small{display:block;color:var(--mu);font-size:.75rem;letter-spacing:1px;text-transform:uppercase}.ct a.row b{font-weight:600}.ic{flex:none;width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:var(--g);background-size:200%;transition:.4s;box-shadow:0 8px 22px #7c5cff44}.ic svg{width:24px;height:24px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.ct .card:hover .ic{transform:rotate(-8deg) scale(1.1);background-position:100%}
footer{text-align:center;color:var(--mu);padding:50px 5vw;font-size:.85rem}
.rv{opacity:0;transform:translateY(40px);transition:1s}.rv.on{opacity:1;transform:none}
#gear{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;width:50px;height:50px;border-radius:50%;border:0;background:var(--g);color:#fff;font-size:1.3rem;cursor:pointer;box-shadow:0 6px 24px #0008}
#ad{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:#0e0c1a;z-index:40;transform:translateX(105%);transition:.4s;overflow:auto;padding:20px;border-left:1px solid #ffffff22}
#ad.on{transform:none}#ad h3{margin-bottom:12px}
#ad label{display:block;font-size:.78rem;color:var(--mu);margin:12px 0 4px}
#ad input,#ad textarea{width:100%;background:#1a1730;border:1px solid #ffffff22;border-radius:10px;color:var(--tx);padding:10px;font:inherit;font-size:.9rem}
#ad textarea{min-height:90px}
#dz{border:2px dashed var(--a);border-radius:14px;padding:22px;text-align:center;color:var(--mu);cursor:pointer}
#dz.drop{background:#7c5cff22}
.sm{padding:9px 16px;font-size:.82rem}
@media(max-width:800px){.hero{grid-template-columns:1fr;text-align:center;padding-top:110px}.hero .bio{margin-inline:auto}.ph{order:-1;width:min(260px,70vw)}nav div a:not(.cta){display:none}}
</style>
</head>
<body>
<i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i>
<nav><b>&lt;Ashaful/&gt;</b><div><a href="#about">About</a><a href="#services">Services</a><a href="#work">Work</a><a href="#contact" class="cta">Contact</a></div></nav>

<section class="hero" id="top">
 <div class="rv"><span class="hi" id="hi"></span><h1 id="nm"></h1><div class="typ" id="typ"></div><p class="bio" id="bio"></p>
 <a class="btn" href="#work">আমার কাজ দেখুন</a><a class="btn o" id="wa" target="_blank" rel="noopener">WhatsApp</a>
 <div class="stats" id="stats"></div></div>
 <div class="ph rv" id="ph"><img id="photo" alt="Md Ashaful Islam"></div>
</section>

<div class="mq"><div id="mq"></div></div>

<section id="about"><h2 class="rv">আমি <span class="grad">কী করি</span></h2><div class="grid" id="services"></div></section>
<section id="work"><h2 class="rv">Selected <span class="grad">Work</span></h2><div class="grid" id="projects"></div></section>
<section id="contact" class="ct"><h2 class="rv">চলুন <span class="grad">একসাথে কাজ করি</span></h2>
 <div class="grid"><div class="card rv"><a class="row" id="cph"></a></div><div class="card rv"><a class="row" id="cwa" target="_blank" rel="noopener"></a></div><div class="card rv"><a class="row" id="cml"></a></div></div></section>
<footer id="ft"></footer>

<button id="gear" title="Edit content">✎</button>
<div id="ad">
 <h3>Content Editor</h3>
 <div id="login"><label>Password</label><input id="pw" type="password" placeholder="admin password"><br><br><button class="btn sm" id="lg">Login</button></div>
 <div id="form" hidden>
  <label>Hero photo (drag &amp; drop বা click)</label><div id="dz">📷 ছবি এখানে drop করুন</div><input type="file" id="fi" accept="image/*" hidden>
  <label>Name</label><input id="f_name"><label>Title lines (প্রতি লাইনে একটা, typing animation এ চলবে)</label><textarea id="f_roles"></textarea>
  <label>Bio</label><textarea id="f_bio"></textarea><label>Phone / WhatsApp</label><input id="f_phone"><label>Email</label><input id="f_email">
  <label>Stats (লাইন: সংখ্যা|লেখা)</label><textarea id="f_stats"></textarea>
  <label>Services (লাইন: Title|Description)</label><textarea id="f_serv"></textarea>
  <label>Projects (লাইন: Title|Description|Link)</label><textarea id="f_proj"></textarea>
  <label>Skills (comma দিয়ে)</label><textarea id="f_skills"></textarea>
  <br><br><button class="btn sm" id="sv">Save</button><button class="btn sm o" id="ex">Export JSON</button><button class="btn sm o" id="rs">Reset</button>
  <p style="color:var(--mu);font-size:.78rem;margin-top:10px">Save করলে এই browser এ থাকে। সবার জন্য live করতে Export JSON করে কোডের DEFAULT এ বসিয়ে GitHub এ push করুন।</p>
 </div>
</div>

<script>
const PASS="ashaful@123"; // এটা পরিবর্তন করুন
let D={name:"Md Ashaful Islam",roles:["WordPress Developer","Landing Page Specialist","Bug Fixing Expert","Laravel E-commerce Support"],
bio:"৩ বছরের অভিজ্ঞতা নিয়ে আমি দ্রুত, সুন্দর ও responsive WordPress landing page বানাই। Bug fixing, speed optimization আর Laravel e-commerce এর dynamic content নিয়েও কাজ করি।",
phone:"01725414721",email:"ashraful.server@gmail.com",photo:"",
stats:["3+|বছরের অভিজ্ঞতা","50+|Landing Page","100%|Responsive"],
services:["WordPress Landing Page|Conversion focused, mobile-first ও দ্রুত লোড হওয়া পেজ।","Bug Fixing|Plugin conflict, layout ও error দ্রুত সমাধান।","Laravel E-commerce|Admin panel থেকে dynamic content ও product edit এ কাজ।","Speed &amp; SEO|Core Web Vitals ও on-page SEO optimization।"],
projects:["Sohag Online|বর্তমানে যে কোম্পানিতে full time কাজ করছি।|https://sohagonline.com/","Landing Page Collection|WordPress এ বানানো বিভিন্ন landing page।|#contact","E-commerce Dynamic Panel|Drag &amp; drop দিয়ে content ও image edit সিস্টেম।|#contact"],
skills:"WordPress,Elementor,HTML5,CSS3,JavaScript,Laravel,WooCommerce,Bug Fixing,SEO,Responsive Design"};
try{const s=localStorage.getItem("pf");if(s)D=Object.assign(D,JSON.parse(s))}catch(e){}
const $=id=>document.getElementById(id),L=t=>t.split("\n").map(x=>x.trim()).filter(Boolean);
const avatar="data:image/svg+xml;utf8,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><rect width="200" height="200" fill="#12101f"/><text x="100" y="125" font-size="80" text-anchor="middle" fill="#7c5cff" font-family="sans-serif" font-weight="700">MA</text></svg>');
let ty;const S=p=>'<span class="ic"><svg viewBox="0 0 24 24">'+p+'</svg></span>';const IC={ph:S('<path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/>'),wa:S('<path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8z"/><path d="M9 9.5c0 3 2.5 5.5 5.5 5.5l1-1.2-1.8-.9-.7.6a3.4 3.4 0 0 1-1.6-1.6l.6-.7-.9-1.8z"/>'),ml:S('<rect x="2" y="4" width="20" height="16" rx="3"/><path d="m22 7-10 6.5L2 7"/>')};
function render(){
 $("hi").textContent="HELLO, আমি";$("nm").innerHTML='<span class="grad">'+D.name+'</span>';$("bio").innerHTML=D.bio;
 $("photo").src=D.photo||avatar;
 const n="88"+D.phone.replace(/^0/,"");$("wa").href=$("cwa").href="https://wa.me/"+n+"?text=Hello%20Ashaful";
 $("cph").href="tel:"+D.phone;$("cph").innerHTML=IC.ph+'<span><small>Call</small><b>'+D.phone+'</b></span>';$("cwa").innerHTML=IC.wa+'<span><small>WhatsApp</small><b>'+D.phone+'</b></span>';$("cml").href="mailto:"+D.email;$("cml").innerHTML=IC.ml+'<span><small>Email</small><b>'+D.email+'</b></span>';
 $("stats").innerHTML=D.stats.map(s=>{const[a,b]=s.split("|");return'<div class="card stat"><b class="grad">'+a+'</b><span style="color:var(--mu);font-size:.85rem">'+(b||"")+'</span></div>'}).join("");
 $("services").innerHTML=D.services.map((s,i)=>{const[a,b]=s.split("|");return'<div class="card rv"><div class="n">0'+(i+1)+'</div><h3>'+a+'</h3><p>'+(b||"")+'</p></div>'}).join("");
 $("projects").innerHTML=D.projects.map(s=>{const[a,b,c]=s.split("|");return'<div class="card rv tl"><h3>'+a+'</h3><p>'+(b||"")+'</p><a href="'+(c||"#")+'" '+(/^http/.test(c||"")?'target="_blank" rel="noopener"':"")+'>দেখুন →</a></div>'}).join("");
 const sk=D.skills.split(",").map(x=>"<span>✦ "+x.trim()+"</span>").join("");$("mq").innerHTML=sk+sk;
 $("ft").textContent="© "+new Date().getFullYear()+" "+D.name+" · Made with ♥";
 clearInterval(ty);let r=0,c=0,del=false;const el=$("typ");
 ty=setInterval(()=>{const w=D.roles[r%D.roles.length]||"";c+=del?-1:1;el.textContent=w.slice(0,c);if(!del&&c>=w.length)del=true,c=w.length+8;else if(del&&c<=0)del=false,r++,c=0;if(del&&c>w.length)el.textContent=w},90);
 obs();
}
const io=new IntersectionObserver(e=>e.forEach(x=>x.isIntersecting&&x.target.classList.add("on")),{threshold:.15});
function obs(){document.querySelectorAll(".rv").forEach(e=>io.observe(e));
 document.querySelectorAll(".tl").forEach(c=>{c.onmousemove=e=>{const b=c.getBoundingClientRect(),x=(e.clientX-b.left)/b.width-.5,y=(e.clientY-b.top)/b.height-.5;c.style.transform="perspective(600px) rotateY("+x*10+"deg) rotateX("+-y*10+"deg)"};c.onmouseleave=()=>c.style.transform=""})}
function fill(){$("f_name").value=D.name;$("f_roles").value=D.roles.join("\n");$("f_bio").value=D.bio;$("f_phone").value=D.phone;$("f_email").value=D.email;$("f_stats").value=D.stats.join("\n");$("f_serv").value=D.services.join("\n");$("f_proj").value=D.projects.join("\n");$("f_skills").value=D.skills}
function save(){try{localStorage.setItem("pf",JSON.stringify(D))}catch(e){alert("Storage full – ছোট ছবি দিন বা Export করুন")}}
function img(f){if(!f||!/^image/.test(f.type))return;const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const m=700,s=Math.min(1,m/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*s;c.height=i.height*s;c.getContext("2d").drawImage(i,0,0,c.width,c.height);D.photo=c.toDataURL("image/jpeg",.85);save();render()};i.src=r.result};r.readAsDataURL(f)}
const open=()=>{$("ad").classList.add("on")};
$("gear").onclick=()=>$("ad").classList.toggle("on");
if(location.hash==="#admin")open();
$("lg").onclick=()=>{if($("pw").value===PASS){$("login").hidden=true;$("form").hidden=false;fill()}else alert("Wrong password")};
$("sv").onclick=()=>{D.name=$("f_name").value;D.roles=L($("f_roles").value);D.bio=$("f_bio").value;D.phone=$("f_phone").value;D.email=$("f_email").value;D.stats=L($("f_stats").value);D.services=L($("f_serv").value);D.projects=L($("f_proj").value);D.skills=$("f_skills").value;save();render();$("ad").classList.remove("on")};
$("ex").onclick=()=>{const t=JSON.stringify(D);navigator.clipboard&&navigator.clipboard.writeText(t).catch(()=>{});prompt("Copy this JSON:",t)};
$("rs").onclick=()=>{if(confirm("Reset?")){try{localStorage.removeItem("pf")}catch(e){}location.reload()}};
[["dz",$("dz")],["ph",$("ph")]].forEach(([k,e])=>{e.ondragover=v=>{v.preventDefault();e.classList.add("drop")};e.ondragleave=()=>e.classList.remove("drop");e.ondrop=v=>{v.preventDefault();e.classList.remove("drop");if(!$("form").hidden)img(v.dataTransfer.files[0])}});
$("dz").onclick=()=>$("fi").click();$("fi").onchange=e=>img(e.target.files[0]);
render();
</script>
</body>
</html>
